name: lein all test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: true

    strategy:
      matrix:
        java-version: [17, 21, 25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start RabbitMQ
        run: |
          docker run -d --name rabbitmq \
            -p 5672:5672 -p 15672:15672 \
            -v "$PWD/bin/ci/rabbitmq.conf:/etc/rabbitmq/conf.d/99-langohr.conf:ro" \
            rabbitmq:4-management
          echo "RABBITMQ_CONTAINER_ID=$(docker inspect -f '{{.Id}}' rabbitmq)" >> "$GITHUB_ENV"
          timeout 60 bash -c 'until docker exec rabbitmq rabbitmq-diagnostics -q ping; do sleep 2; done'

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 2.11.2

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ hashFiles('project.clj') }}
          # key: cljdeps-${{ hashFiles('build.boot') }}
          restore-keys: cljdeps-

      - name: Install Leiningen
        run: |
          curl -O https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein
          chmod +x lein
          sudo mv lein /usr/local/bin/
          lein version  # This will download Leiningen if not cached

      - name: Install dependencies
        run: lein deps

      - name: Configure RabbitMQ
        run: LANGOHR_RABBITMQCTL=DOCKER:${{env.RABBITMQ_CONTAINER_ID}} LANGOHR_RABBITMQ_PLUGINS=DOCKER:${{env.RABBITMQ_CONTAINER_ID}} bin/ci/before_build.sh

      - name: Run tests
        run: LANGOHR_RABBITMQCTL=DOCKER:${{env.RABBITMQ_CONTAINER_ID}} LANGOHR_RABBITMQ_PLUGINS=DOCKER:${{env.RABBITMQ_CONTAINER_ID}} lein test